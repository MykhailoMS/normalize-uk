[package]
name = "normalize-uk"
version = "0.5.0"
edition = "2021"
rust-version = "1.82"
description = "Ukrainian text normalization, tokenization and sentence splitting"
license = "MIT"
repository = "https://github.com/RustedBytes/normalize-uk"
readme = "README.md"
keywords = ["ukrainian", "nlp", "normalization", "tokenizer", "tts"]
categories = ["text-processing", "internationalization"]
exclude = ["/.github"]

[lib]
name = "normalize_uk"
path = "src/lib.rs"

[dependencies]
fancy-regex = "0.19"
once_cell = "1"

[dev-dependencies]

[profile.release]
opt-level = 3
